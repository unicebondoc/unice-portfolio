<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#EEEEFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#CCCCFF" stop-opacity="0.50"/>
      <stop offset="78%" stop-color="#6666BB" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#010608" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="shine" cx="38%" cy="26%" r="32%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
