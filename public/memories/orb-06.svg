    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#010608" stop-opacity="0"/>
      <stop offset="100%" stop-color="#010608" stop-opacity="0.85"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#010608"/>
  <circle cx="200" cy="200" r="192" fill="url(#glow)"/>
  <circle cx="200" cy="200" r="58" fill="#DDDDFF" fill-opacity="0.35"/>
  <circle cx="200" cy="200" r="24" fill="#FFFFFF" fill-opacity="0.85"/>
  <circle cx="200" cy="200" r="180" fill="url(#shine)"/>
  <circle cx="200" cy="200" r="192" fill="url(#vignette)"/>
  <!-- Dreamy rings -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#CCCCFF" stroke-opacity="0.10" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="200" cy="200" r="187" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1.5"/>
