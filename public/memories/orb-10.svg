<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <radialGradient id="glow" cx="46%" cy="44%" r="56%">
      <stop offset="0%" stop-color="#55FFAA" stop-opacity="0.88"/>
      <stop offset="40%" stop-color="#00DD77" stop-opacity="0.38"/>
      <stop offset="78%" stop-color="#004422" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#010608" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="shine" cx="36%" cy="30%" r="28%">
      <stop offset="0%" stop-color="#DDFFF0" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#DDFFF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#010608" stop-opacity="0"/>
