  <rect width="400" height="400" fill="#010608"/>
  <circle cx="200" cy="200" r="192" fill="url(#glow)"/>
  <circle cx="200" cy="200" r="192" fill="url(#root)"/>
  <circle cx="200" cy="200" r="50" fill="#00DD77" fill-opacity="0.28"/>
  <circle cx="200" cy="200" r="20" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="200" cy="200" r="180" fill="url(#shine)"/>
  <circle cx="200" cy="200" r="192" fill="url(#vignette)"/>
  <circle cx="200" cy="200" r="187" fill="none" stroke="#00DD77" stroke-opacity="0.16" stroke-width="1.5"/>
  <!-- Roots/growth hint rings -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="#00FF88" stroke-opacity="0.05" stroke-width="1"/>
