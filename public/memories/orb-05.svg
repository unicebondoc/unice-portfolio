<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <radialGradient id="glow" cx="48%" cy="45%" r="56%">
      <stop offset="0%" stop-color="#D49AFF" stop-opacity="0.92"/>
      <stop offset="40%" stop-color="#C77DFF" stop-opacity="0.42"/>
      <stop offset="78%" stop-color="#6600BB" stop-opacity="0.10"/>
